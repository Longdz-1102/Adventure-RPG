<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GAME RPG ⚔️</title>
  <style>
    body {
      background: #000;
      color: white;
      text-align: center;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    canvas {
      background: #222;
      border-radius: 12px;
      margin-top: 10px;
      image-rendering: pixelated;
      width: 90vw;
      height: 50vh;
      max-width: 600px;
    }
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      z-index: 10;
    }
    #controls button {
      width: 60px;
      height: 60px;
      font-size: 24px;
      border-radius: 10px;
      border: none;
      background: #333;
      color: white;
    }
    #controls button:active { background: #666; }
    .row { display:flex; gap:5px; }
    #attack.cooldown {
      opacity: 0.5; pointer-events: none; transform: scale(0.9); transition: all 0.3s;
    }
    /* nhỏ hiển thị thông báo tạm thời trên màn hình (thay vì alert spam) */
    #toast {
      position: fixed; left: 50%; bottom: 200px; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: white; padding: 8px 12px; border-radius: 8px;
      display: none; z-index: 2000; font-family: sans-serif;
    }
  </style>
</head>
<body>
  <h1>GAME RPG ⚔️</h1>
  <canvas id="gameCanvas" width="320" height="320"></canvas>

  <div id="controls">
    <div class="row">
      <button id="up">⬆️</button>
    </div>
    <div class="row">
      <button id="left">⬅️</button>
      <button id="attack">⚔️</button>
      <button id="right">➡️</button>
    </div>
    <div class="row">
      <button id="down">⬇️</button>
      <button id="talk">:3</button>
    </div>
  </div>

  <div id="toast"></div>

<script>
// =================== ASSETS ===================
const playerImg = new Image();
playerImg.src = "2025-11-03_14.26.24.png"; // thay bằng file của bạn
let playerImgLoaded = false;
playerImg.onload = () => { playerImgLoaded = true; draw(); };

const bgm = new Audio("RPG song 2.mp3"); // thay bằng file của bạn (optional)
bgm.loop = true; bgm.volume = 1;
window.addEventListener("click", () => { if (bgm.paused) bgm.play(); });

const swordImages = { wood: new Image(), iron: new Image() };
swordImages.wood.src = "wood.sword.png";
swordImages.iron.src = "iron.sword.png";

// =================== CORE VARS ===================
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const tileSize = 32;
const mapSize = 10;

let gameOver = false;
let hasReset = false;
let canAttack = true;
let lastEnemyMove = 0;

const toastDiv = document.getElementById("toast");
function toast(msg, ms = 900) {
  toastDiv.textContent = msg;
  toastDiv.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastDiv.style.display = "none", ms);
}

// =================== PLAYER ===================
const player = {
  x: 1, y: 1,
  hp: 10, maxHp: 10,
  weapon: "Tay không",
  inventory: { wood: 0, iron: 0 }
};

// =================== MAPS ===================
const maps = [
  {
    id: 0,
    color: "#7ec850",
    obstacles: [],
    enemies: [],
    npcs: [
      { x:4, y:1, message:"Xin chào :3!" },
      { x:9, y:3, message:"Cẩn thận nhé!" },
      { x:1, y:9, message:"Ta là thợ rèn, muốn rèn gì nào?" }
    ]
  },
  {
    id: 1,
    color: "#00aa00",
    obstacles: [
      {x:0,y:3},{x:1,y:3},{x:2,y:3},{x:3,y:3},{x:4,y:3},
      {x:4,y:0},{x:4,y:2},{x:7,y:3},{x:8,y:3},{x:9,y:3},
      {x:2,y:7},{x:3,y:7},{x:4,y:7},{x:7,y:7},{x:8,y:7},
      {x:1,y:7},{x:0,y:7},{x:9,y:7},
      {x:9,y:8},{x:9,y:0},{x:9,y:1},
      {x:9,y:2},{x:9,y:9}
    ],
    enemies: [ { x:8, y:8, hp:3, maxHp:3, visible:true, hasDropped:false } ],
    npcs: [ { x:2, y:2, message:"Càng vào sâu, quái càng mạnh!" } ]
  },
  {
    id: 2,
    color: "#3366aa",
    obstacles: [
      {x:9,y:0},{x:9,y:1},{x:9,y:2},{x:9,y:3},{x:9,y:7},
      {x:9,y:8},{x:0,y:7},{x:9,y:9},{x:0,y:7},{x:3,y:3},
      {x:4,y:3},{x:5,y:3},{x:6,y:3},{x:6,y:4},{x:6,y:5},
      {x:6,y:6},{x:5,y:7},{x:4,y:7},{x:6,y:7},{x:3,y:7},
      {x:3,y:6},{x:3,y:5},{x:3,y:4},{x:0,y:3},{x:0,y:1},
      {x:0,y:7},{x:0,y:8},{x:0,y:0},{x:0,y:2},{x:0,y:9}
    ],
    enemies: [
      { x:2, y:2, hp:3, maxHp:3, visible:true, hasDropped:false },
      { x:2, y:8, hp:3, maxHp:3, visible:true, hasDropped:false }
    ],
    npcs: []
  },
  {
    id: 3,
    color: "#8B4513",
    obstacles: [
      {x:0,y:0},{x:1,y:0},{x:2,y:0},{x:3,y:0},{x:4,y:0},{x:5,y:0},
      {x:6,y:0},{x:7,y:0},{x:8,y:0},{x:9,y:0},{x:0,y:2},{x:0,y:3},
      {x:9,y:1},{x:9,y:2},{x:9,y:3},{x:9,y:4},{x:9,y:5},
      {x:9,y:6},{x:9,y:7},{x:9,y:8},{x:9,y:9},
      {x:8,y:9},{x:7,y:9},{x:6,y:9},{x:0,y:1},{x:0,y:7},{x:0,y:8},
      {x:0,y:9},{x:1,y:9},{x:2,y:9},{x:3,y:9},{x:4,y:9},{x:5,y:9}
    ],
    enemies: [ { x:4, y:4, hp:100, maxHp:100, isBoss:true, visible:true } ],
    npcs: []
  }
];

let currentMap = 0;
const mapWidth = 10;

// =================== UTILS ===================
function tileBlocked(map, x, y) {
  // check bounds
  if (x < 0 || x >= mapSize || y < 0 || y >= mapSize) return true;
  // check obstacles
  if (map.obstacles.some(o => o.x === x && o.y === y)) return true;
  return false;
}

function randomEmptyTile(map) {
  for (let tries=0; tries<200; tries++) {
    const x = Math.floor(Math.random() * mapSize);
    const y = Math.floor(Math.random() * mapSize);
    // not on player, not obstacle, not on NPC
    const occEnemy = map.enemies.some(en => en.visible && en.hp > 0 && en.x === x && en.y === y);
    const occNPC = (map.npcs || []).some(n => n.x === x && n.y === y);
    if (!tileBlocked(map, x, y) && !(player.x === x && player.y === y) && !occEnemy && !occNPC) return {x,y};
  }
  // fallback
  return { x:0, y:0 };
}

// =================== DRAW ===================
function draw() {
  ctx.clearRect(0,0, canvas.width, canvas.height);
  const map = maps[currentMap];

  // background tiles
  ctx.fillStyle = map.color;
  for (let y=0;y<mapSize;y++){
    for (let x=0;x<mapSize;x++){
      ctx.fillRect(x*tileSize, y*tileSize, tileSize-1, tileSize-1);
    }
  }

  // obstacles
  ctx.fillStyle = "#555";
  map.obstacles.forEach(o => ctx.fillRect(o.x*tileSize, o.y*tileSize, tileSize-2, tileSize-2));

  // NPCs
  ctx.fillStyle = "yellow";
  (map.npcs || []).forEach(n => {
    ctx.fillRect(n.x*tileSize, n.y*tileSize, tileSize, tileSize);
  });

 // enemies
(map.enemies || []).forEach(e => {
  if (!e.visible) return;
  if (e.hp <= 0) return; // dead (hidden)

  // 👇 thêm scale cho map 3 hoặc boss
  let scale = 1; // mặc định
  if (map.id === 3) {
    scale = e.isBoss ? 2.0 : 1.5; // boss to hơn, quái thường to nhẹ
  }

  const size = tileSize * scale;

  // vẽ quái to hơn
  ctx.fillStyle = e.isBoss ? "red" : "red";
  ctx.fillRect(e.x * tileSize, e.y * tileSize, size, size);

  // thanh máu
  if (!e.isBoss) {
    ctx.fillStyle = "black";
    ctx.fillRect(e.x * tileSize, e.y * tileSize - 6, size, 5);
    ctx.fillStyle = "lime";
    ctx.fillRect(e.x * tileSize, e.y * tileSize - 6, size * Math.max(0, e.hp / e.maxHp), 5);
  }
});

  // boss big bar on top-middle
  const boss = map.enemies.find(e => e.isBoss && e.visible && e.hp > 0);
  if (boss) {
    const barWidth = canvas.width * 0.6;
    const barHeight = 25;
    const barX = (canvas.width - barWidth)/2;
    const barY = 10;
    ctx.fillStyle = "black";
    ctx.fillRect(barX-2, barY-2, barWidth+4, barHeight+4);
    ctx.fillStyle = "red";
    ctx.fillRect(barX, barY, barWidth, barHeight);
    ctx.fillStyle = "lime";
    ctx.fillRect(barX, barY, barWidth * Math.max(0, boss.hp / boss.maxHp), barHeight);
    ctx.fillStyle = "white";
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.fillText("BOSS", canvas.width/2, barY + barHeight + 20);
  }

  // player
  if (playerImgLoaded) {
    ctx.drawImage(playerImg, player.x*tileSize, player.y*tileSize, tileSize, tileSize);
  } else {
    // fallback rectangle
    ctx.fillStyle = "white";
    ctx.fillRect(player.x*tileSize+6, player.y*tileSize+6, tileSize-12, tileSize-12);
  }

  // weapon image if any
  if (player.weapon === "wood" && swordImages.wood.complete) {
    ctx.drawImage(swordImages.wood, player.x*tileSize + tileSize, player.y*tileSize + 4, 16, 16);
  } else if (player.weapon === "iron" && swordImages.iron.complete) {
    ctx.drawImage(swordImages.iron, player.x*tileSize + tileSize, player.y*tileSize + 4, 16, 16);
  }

  // player hp bar
  const barW = 40, barH = 5;
  const pBarX = player.x*tileSize + (tileSize/2) - (barW/2);
  const pBarY = player.y*tileSize - 8;
  ctx.fillStyle = "black";
  ctx.fillRect(pBarX-1, pBarY-1, barW+2, barH+2);
  ctx.fillStyle = "lime";
  ctx.fillRect(pBarX, pBarY, barW * Math.max(0, player.hp / player.maxHp), barH);

  // HUD text
  ctx.fillStyle = "white";
  ctx.font = "14px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(`Map: ${map.id}`, 10, 15);
  ctx.fillText(`HP: ${player.hp}`, 250, 15);
  const wName = (player.weapon === "wood") ? "Kiếm Gỗ" : (player.weapon === "iron") ? "Kiếm Sắt" : "Tay không";
  ctx.fillText(`Vũ khí: ${wName}`, 10, 35);
}

// =================== MOVEMENT ===================
function updateMap() {
  // Sang phải qua map kế tiếp
  if (player.x >= mapSize) {
    if (currentMap < maps.length - 1) {
      currentMap++;
      player.x = 0; // xuất hiện bên trái map mới
    } else {
      player.x = mapSize - 1; // map cuối cùng -> đứng lại
    }
  }

  // Sang trái qua map trước
  else if (player.x < 0) {
    if (currentMap > 0) {
      currentMap--;
      player.x = mapSize - 1; // xuất hiện bên phải map trước
    } else {
      player.x = 0; // map đầu tiên -> đứng lại
    }
  }

  // Giữ người chơi trong phạm vi map
  player.y = Math.max(0, Math.min(mapSize - 1, player.y));

  draw();
}

function isBlocked(x, y) {
  const map = maps[currentMap];
  return tileBlocked(map, x, y);
}

function movePlayer(dx, dy) {
  if (gameOver) return;

  let nx = player.x + dx;
  let ny = player.y + dy;

  // Nếu đang vượt biên sang trái hoặc phải thì cho phép đổi map luôn
  if (nx >= mapSize || nx < 0) {
    player.x = nx; // tạm cập nhật để qua map
    updateMap();   // chuyển map và reset toạ độ
    draw();
    return;
  }

  // Nếu không vượt biên thì kiểm tra vật cản bình thường
  if (!isBlocked(nx, ny)) {
    player.x = nx;
    player.y = ny;
    draw();
  }
}

document.getElementById("up").onclick = () => movePlayer(0, -1);
document.getElementById("down").onclick = () => movePlayer(0, 1);
document.getElementById("left").onclick = () => movePlayer(-1, 0);
document.getElementById("right").onclick = () => movePlayer(1, 0);

// =================== ATTACK ===================
const attackButton = document.getElementById("attack");
attackButton.onclick = () => {
  if (gameOver || !canAttack) return;
  const map = maps[currentMap];
  let hitSomething = false;
  map.enemies.forEach(e => {
    if (!e.visible || e.hp <= 0) return;
    const dx = Math.abs(player.x - e.x);
    const dy = Math.abs(player.y - e.y);
    // range: close (you used dx<=2 && dy<=1 before) -> keep that
    if (dx <= 2 && dy <= 1) {
      let damage = 1;
      if (player.weapon === "wood") damage = 2;
      else if (player.weapon === "iron") damage = 4;
      e.hp -= damage;
      hitSomething = true;
      // on kill
      if (e.hp <= 0) handleEnemyDeath(e, map);
    }
  });
  if (hitSomething) {
    canAttack = false;
    attackButton.classList.add("cooldown");
    setTimeout(() => { canAttack = true; attackButton.classList.remove("cooldown"); }, 1000);
    draw();
  } else {
    // no hit feedback (optional)
    // toast("Không trúng gì!");
  }
};

// =================== NPC & CRAFT ===================
const talkButton = document.getElementById("talk");
talkButton.onclick = () => {
  const map = maps[currentMap];
  (map.npcs || []).forEach(n => {
    const dx = Math.abs(player.x - n.x);
    const dy = Math.abs(player.y - n.y);
    if (dx <= 1 && dy <= 1) interactWithNPC(n);
  });
};

const craftingDiv = document.createElement("div");
craftingDiv.style = `
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.9);padding:16px;border:2px solid white;
  border-radius:10px;color:white;display:none;z-index:1000;text-align:center;
`;
document.body.appendChild(craftingDiv);

function showCraftingMenu() {
  craftingDiv.innerHTML = `
    <h3>Chế tạo vũ khí</h3>
    <p>Bạn có: ${player.inventory.wood} gỗ, ${player.inventory.iron} sắt</p>
    <button id="craftWoodSword">🪵 Kiếm Gỗ (2 gỗ)</button><br><br>
    <button id="craftIronSword">⚔️ Kiếm Sắt (2 sắt + 1 gỗ)</button><br><br>
    <button id="closeCraft">❌ Thoát</button>
  `;
  craftingDiv.style.display = "block";
  document.getElementById("craftWoodSword").onclick = () => craftWeapon(1);
  document.getElementById("craftIronSword").onclick = () => craftWeapon(2);
  document.getElementById("closeCraft").onclick = closeCraftingMenu;
}

function closeCraftingMenu() { craftingDiv.style.display = "none"; }

function interactWithNPC(npc) {
  if (npc.message && npc.message.toLowerCase().includes("thợ")) showCraftingMenu();
  else if (npc.message) alert(npc.message);
}

function craftWeapon(choice) {
  if (choice === 1) {
    if (player.inventory.wood >= 2) {
      player.inventory.wood -= 2;
      player.weapon = "wood";
      toast("🪵 Bạn đã chế tạo Kiếm Gỗ!", 1200);
      closeCraftingMenu();
      draw();
    } else alert("Thiếu gỗ để chế tạo!");
  } else if (choice === 2) {
    if (player.inventory.iron >= 2 && player.inventory.wood >= 1) {
      player.inventory.iron -= 2;
      player.inventory.wood -= 1;
      player.weapon = "iron";
      toast("⚔️ Bạn đã chế tạo Kiếm Sắt!", 1200);
      closeCraftingMenu();
      draw();
    } else alert("Thiếu nguyên liệu để chế tạo!");
  }
}

// =================== ENEMY DEATH / RESPAWN ===================
function handleEnemyDeath(e, map) {
  // drop once
  if (!e.hasDropped) {
    e.hasDropped = true;
    const drop = Math.random();
    if (drop < 0.5) {
      player.inventory.wood++;
      toast("🌲 Nhặt được 1 Gỗ!", 900);
    } else {
      player.inventory.iron++;
      toast("💎 Nhặt được 1 Sắt!", 900);
    }
  }

  // hide enemy (unless boss - boss may stay but with 0 HP; here we hide non-boss)
  if (e.isBoss) {
    e.visible = false; // boss defeated -> hidden
    // you can choose to not respawn boss
    toast("Bạn đã hạ BOSS!", 1500);
  } else {
    e.visible = false;
    e.respawnScheduled = true;
    // schedule respawn in 15s
    setTimeout(() => {
      e.hp = e.maxHp;
      e.visible = true;
      e.respawnScheduled = false;
      e.hasDropped = false;
      // place on random empty tile of current map (or same map)
      const pos = randomEmptyTile(map);
      e.x = pos.x; e.y = pos.y;
      toast("Quái đã hồi sinh!", 1000);
    }, 15000);
  }
}

// =================== ENEMY AI / MOVEMENT / ATTACK ===================
function enemyAI() {
  const map = maps[currentMap];
  const now = Date.now();
  if (now - lastEnemyMove < 600) return;
  lastEnemyMove = now;

  for (let i = 0; i < map.enemies.length; i++) {
    const e = map.enemies[i];

    // skip if invisible or dead (non-visible)
    if (!e.visible || e.hp <= 0) continue;

    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const distance = Math.abs(dx) + Math.abs(dy);

    let moveX = 0, moveY = 0;
    if (distance <= 4) {
      moveX = Math.sign(dx);
      moveY = Math.sign(dy);
    } else {
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      const dir = dirs[Math.floor(Math.random() * dirs.length)];
      moveX = dir[0]; moveY = dir[1];
    }

    const newX = e.x + moveX;
    const newY = e.y + moveY;
    // don't walk into obstacles or outside
    if (!tileBlocked(map, newX, newY)) {
      // also avoid moving into player (so enemy doesn't occupy same tile)
      if (!(newX === player.x && newY === player.y)) {
        e.x = Math.max(0, Math.min(mapSize-1, newX));
        e.y = Math.max(0, Math.min(mapSize-1, newY));
      }
    }

    // attack if adjacent
    if (Math.abs(dx) <= 1 && Math.abs(dy) <= 1 && player.hp > 0) {
      player.hp -= (currentMap + 1); // more damage on deeper maps
      if (player.hp < 0) player.hp = 0;
      
    }
  }

  draw();
}

// =================== GAMEOVER ===================
function checkGameOver() {
  if (player.hp <= 0 && !hasReset) {
    hasReset = true;
    gameOver = true;
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "white";
    ctx.font = "24px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("💀 Bạn đã bị đánh bại!", canvas.width/2, canvas.height/2);
    bgm.pause();
    setTimeout(() => location.reload(), 2000);
  }
}

// =================== GAMELOOP ===================
function gameLoop() {
  enemyAI();
  checkGameOver();
  requestAnimationFrame(gameLoop);
}

// initial draw & start
draw();
gameLoop();

</script>
</body>
</html>
