<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GAME RPG ⚔️</title>
  <style>
 body {
  background: #000;
  color: white;
  text-align: center;
  font-family: sans-serif;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center; /* canh giữa ngang */
  justify-content: flex-start;
  height: 100vh;
  overflow: hidden;
}

/* canvas hiển thị giữa trang */
canvas {
  display: block;
  margin: 20px auto;
  border-radius: 20px;
}

/* khu điều khiển */
#controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  z-index: 10;
  margin-top: 10px;
}

#controls button {
  width: 60px;
  height: 60px;
  font-size: 24px;
  border-radius: 10px;
  border: none;
  background: #333;
  color: white;
}

#controls button:active {
  background: #666;
}

.row {
  display: flex;
  gap: 5px;
}

#attack.cooldown {
  opacity: 0.5;
  pointer-events: none;
  transform: scale(0.9);
  transition: all 0.3s;
}

/* Thông báo tạm thời */
#toast {
  position: fixed;
  left: 50%;
  bottom: 200px;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.8);
  color: white;
  padding: 8px 12px;
  border-radius: 8px;
  display: none;
  z-index: 2000;
  font-family: sans-serif;
}

  </style>
</head>
<body>
  <h1> RPG GAME ⚔️</h1>
  <canvas id="gameCanvas" width="320" height="320"></canvas>
  <div id="controls">
    <div class="row">
      <button id="up">⬆️</button>
    </div>
    <div class="row">
      <button id="left">⬅️</button>
      <button id="attack">⚔️</button>
      <button id="right">➡️</button>
    </div>
    <div class="row">
      <button id="down">⬇️</button>
      <button id="talk">:3</button>
      <button id="heal">💊</button>
    </div>
  </div>

  <div id="toast"></div>

<script>
// =================== ASSETS ===================
const playerImg = new Image();
playerImg.src = "2025-11-03_14.26.24.png"; // thay bằng file của bạn
let playerImgLoaded = false;
playerImg.onload = () => { playerImgLoaded = true; draw(); };

const bgm = new Audio("RPG song 2.mp3"); // thay bằng file của bạn (optional)
bgm.loop = true; bgm.volume = 1;
window.addEventListener("click", () => { if (bgm.paused) bgm.play(); });

const swordImages = { 
  wood: new Image(),
  iron: new Image(),
  legendary: new Image() // thêm dòng này
};

swordImages.wood.src = "wood.sword.png";
swordImages.iron.src = "iron.sword.png";
swordImages.legendary.src = "legendary.Sword.png"; // và thêm dòng này

// =================== CORE VARS ===================
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const tileSize = 32;
const mapSize = 10;

let gameOver = false;
let hasReset = false;
let canAttack = true;
let lastEnemyMove = 0;

const toastDiv = document.getElementById("toast");
function toast(msg, ms = 900) {
  toastDiv.textContent = msg;
  toastDiv.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastDiv.style.display = "none", ms);
}

// =================== PLAYER ===================
const player = {
  x: 1, y: 1,
  hp: 10, maxHp: 10,
  weapon: "Tay không",
  inventory: { wood: 0, iron: 0, potion: 0 },
  damageBonus: 0,   // giá trị cộng thêm khi dùng thuốc
  buffActive: false // đang có buff không
};

// =================== MAPS ===================
const maps = [
  {
    id: 0,
    color: "orange",
    obstacles: [],
    ores: [],
    enemies: [],
    npcs: [{x: 4,y: 1 ,image:"npcs.png",message: "Hôm nay anh cảm thấy thế nào :3"
    }]
  },
  {
    id: 1,
    color: "#7ec850",
    obstacles: [],
    ores: [],
    enemies: [],
    npcs: [
      { x:4, y:1, message:"Nó luôn ở đó không đi đâu cả!" },
      { x:9, y:3, message:"Cẩn thận nhé!" },
      { x:1, y:9, message:"Ta là thợ rèn, muốn rèn gì nào?" }
    ]
  },
  {
    id: 2,
    color: "#00aa00",
    obstacles: [
      {x:0,y:3},{x:1,y:3},{x:2,y:3},{x:3,y:3},{x:4,y:3},
      {x:4,y:0},{x:4,y:2},{x:7,y:3},{x:8,y:3},{x:9,y:3},
      {x:2,y:7},{x:3,y:7},{x:4,y:7},{x:7,y:7},{x:8,y:7},
      {x:1,y:7},{x:0,y:7},{x:9,y:7},
      {x:9,y:8},{x:9,y:0},{x:9,y:1},
      {x:9,y:2},{x:9,y:9}
    ],
    ores: [],
    enemies: [ { x:8, y:8, hp:3, maxHp:3, visible:true, hasDropped:false } ],
    npcs: [ { x:2, y:2, message:"Càng vào sâu, quái càng mạnh!" } ]
  },
  {
    id: 3,
    color: "#3366aa",
    obstacles: [
      {x:9,y:0},{x:9,y:1},{x:9,y:2},{x:9,y:3},{x:9,y:7},
      {x:9,y:8},{x:0,y:7},{x:9,y:9},{x:0,y:7},{x:3,y:3},
      {x:4,y:3},{x:5,y:3},{x:6,y:3},{x:6,y:4},{x:6,y:5},
      {x:6,y:6},{x:5,y:7},{x:4,y:7},{x:6,y:7},{x:3,y:7},
      {x:3,y:6},{x:3,y:5},{x:3,y:4},{x:0,y:3},{x:0,y:1},
      {x:0,y:7},{x:0,y:8},{x:0,y:0},{x:0,y:2},{x:0,y:9}
    ],
    ores:[],
    enemies: [
      { x:2, y:2, hp:3, maxHp:3, visible:true, hasDropped:false },
      { x:2, y:8, hp:3, maxHp:3, visible:true, hasDropped:false }
    ],
    npcs: []
  },
  {
    id: 4,
    color: "#8B4513",
    obstacles: [
      {x:0,y:0},{x:1,y:0},{x:2,y:0},{x:3,y:0},{x:4,y:0},{x:5,y:0},
      {x:6,y:0},{x:7,y:0},{x:8,y:0},{x:9,y:0},{x:0,y:2},{x:0,y:3},
      {x:9,y:1},{x:9,y:2},{x:9,y:3},{x:9,y:4},{x:9,y:5},
      {x:9,y:6},{x:9,y:7},{x:9,y:8},{x:9,y:9},
      {x:8,y:9},{x:7,y:9},{x:6,y:9},{x:0,y:1},{x:0,y:7},{x:0,y:8},
      {x:0,y:9},{x:1,y:9},{x:2,y:9},{x:3,y:9},{x:4,y:9},{x:5,y:9}
    ],
    ores: [],
    enemies: [ { x:4, y:4, hp:250, maxHp:250, isBoss:true, visible:true}],
    npcs: []
  },
  {
  id: 5,
  color:"lightgray",
  obstacles: [],
  ores: [
  { x: 5, y: 4, visible: true },
  { x: 8, y: 6, visible: true },
  { x: 10, y: 9, visible: true }
],
  enemies:[],
  npcs: []
  }
];

let currentMap = 0;
const mapWidth = 10;

function useItem(item) {
  if (!item) return;
  // giữ nếu muốn dùng chung logic, không bắt buộc phải dùng
  if (item.type === "potion" && item.effect === "damageBoost") {
    // deprecated — chúng ta sẽ dùng usePotion() trực tiếp
  }
}

// =================== UTILS ===================
function tileBlocked(map, x, y) {
  // check bounds
  if (x < 0 || x >= mapSize || y < 0 || y >= mapSize) return true;
  // check obstacles
  if (map.obstacles.some(o => o.x === x && o.y === y)) return true;
  return false;
}

function randomEmptyTile(map) {
  for (let tries=0; tries<200; tries++) {
    const x = Math.floor(Math.random() * mapSize);
    const y = Math.floor(Math.random() * mapSize);
    // not on player, not obstacle, not on NPC
    const occEnemy = map.enemies.some(en => en.visible && en.hp > 0 && en.x === x && en.y === y);
    const occNPC = (map.npcs || []).some(n => n.x === x && n.y === y);
    if (!tileBlocked(map, x, y) && !(Math.floor(player.x) === x && Math.floor(player.y) === y) && !occEnemy && !occNPC) return {x,y};
  }
  // fallback
  return { x:0, y:0 };
}

// =================== DRAW ===================
function draw() {
  ctx.clearRect(0,0, canvas.width, canvas.height);
  const map = maps[currentMap];

  // background tiles
  ctx.fillStyle = map.color;
  for (let y=0;y<mapSize;y++){
    for (let x=0;x<mapSize;x++){
      ctx.fillRect(x*tileSize, y*tileSize, tileSize-1, tileSize-1);
    }
  }

  // obstacles
  ctx.fillStyle = "#555";
  map.obstacles.forEach(o => ctx.fillRect(o.x*tileSize, o.y*tileSize, tileSize-2, tileSize-2));

// NPCs
(map.npcs || []).forEach(n => {
  if (n.image && !n._img) {
    n._img = new Image();
    n._img.src = n.image;
  }

  if (n._img && n._img.complete) {
    ctx.drawImage(n._img, n.x * tileSize, n.y * tileSize, tileSize, tileSize);
  } else {
    // Nếu ảnh chưa load hoặc không có -> vẽ ô vàng
    ctx.fillStyle = "yellow";
    ctx.fillRect(n.x * tileSize, n.y * tileSize, tileSize, tileSize);
  }
});
  // enemies
  (map.enemies || []).forEach(e => {
    if (!e.visible) return;
    if (e.hp <= 0) return; // dead (hidden)

    let scale = 1;
    if (map.id === 4) {
      scale = e.isBoss ? 2.0 : 1.5;
    }
    const size = tileSize * scale;

    ctx.fillStyle = e.isBoss ? "darkred" : "red";
    ctx.fillRect(e.x * tileSize, e.y * tileSize, size, size);

    if (!e.isBoss) {
      ctx.fillStyle = "black";
      ctx.fillRect(e.x * tileSize, e.y * tileSize - 6, size, 5);
      ctx.fillStyle = "lime";
      ctx.fillRect(e.x * tileSize, e.y * tileSize - 6, size * Math.max(0, e.hp / e.maxHp), 5);
    }
  });

  // boss big bar
  const boss = map.enemies.find(e => e.isBoss && e.visible && e.hp > 0);
  if (boss) {
    const barWidth = canvas.width * 0.6;
    const barHeight = 25;
    const barX = (canvas.width - barWidth)/2;
    const barY = 10;
    ctx.fillStyle = "black";
    ctx.fillRect(barX-2, barY-2, barWidth+4, barHeight+4);
    ctx.fillStyle = "red";
    ctx.fillRect(barX, barY, barWidth, barHeight);
    ctx.fillStyle = "lime";
    ctx.fillRect(barX, barY, barWidth * Math.max(0, boss.hp / boss.maxHp), barHeight);
    ctx.fillStyle = "white";
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.fillText("BOSS", canvas.width/2, barY + barHeight + 20);
  }

  // player (draw at floored tile for tile-based visuals)
  if (playerImgLoaded) {
    ctx.drawImage(playerImg, Math.floor(player.x)*tileSize, Math.floor(player.y)*tileSize, tileSize, tileSize);
  } else {
    ctx.fillStyle = "white";
    ctx.fillRect(Math.floor(player.x)*tileSize+6, Math.floor(player.y)*tileSize+6, tileSize-12, tileSize-12);
  }

  // weapon image
  if (player.weapon === "wood" && swordImages.wood.complete) {
    ctx.drawImage(swordImages.wood, Math.floor(player.x)*tileSize + tileSize, Math.floor(player.y)*tileSize + 4, 16, 16);
  }else if (player.weapon === "iron" && swordImages.iron.complete) {
    ctx.drawImage(swordImages.iron, Math.floor(player.x)*tileSize + tileSize, Math.floor(player.y)*tileSize + 4, 16, 16);
  }else if (player.weapon === "legendarySword" && swordImages.legendary.complete) {
  ctx.drawImage(
    swordImages.legendary,
    Math.floor(player.x) * tileSize + tileSize,
    Math.floor(player.y) * tileSize + 4,
    16, 16
  );
}

  // player hp bar
  const barW = 40, barH = 5;
  const pBarX = Math.floor(player.x)*tileSize + (tileSize/2) - (barW/2);
  const pBarY = Math.floor(player.y)*tileSize - 8;
  ctx.fillStyle = "black";
  ctx.fillRect(pBarX-1, pBarY-1, barW+2, barH+2);
  ctx.fillStyle = "lime";
  ctx.fillRect(pBarX, pBarY, barW * Math.max(0, player.hp / player.maxHp), barH);

  // HUD
  ctx.fillStyle = "white";
  ctx.font = "14px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(`Map: ${map.id}`, 10, 15);
  ctx.fillText(`HP: ${player.hp}`, 250, 15);
  const wName = (player.weapon === "wood")
  ? "Kiếm Gỗ"
  : (player.weapon === "iron")
  ? "Kiếm Sắt"
  : (player.weapon === "legendarySword")
  ? "Kiếm Huyền Thoại 🔥"
  : "Tay không";

ctx.fillText(`Vũ khí: ${wName}`, 10, 35);
}

// =================== MOVEMENT (original tile-step behavior kept) ===================
function updateMap() {
  if (player.x >= mapSize) {
    if (currentMap < maps.length - 1) {
      currentMap++;
      player.x = 0;
    } else {
      player.x = mapSize - 1;
    }
  } else if (player.x < 0) {
    if (currentMap > 0) {
      currentMap--;
      player.x = mapSize - 1;
    } else {
      player.x = 0;
    }
  }

  // 🔥 kiểm tra di chuyển lên/xuống giữa map 1 và 5
  if (maps[currentMap].id === 1 && player.y < 0) {
    const target = maps.find(m => m.id === 5);
    currentMap = maps.indexOf(target);
    player.y = mapSize - 1;
  } 
  else if (maps[currentMap].id === 5 && player.y >= mapSize) {
    const target = maps.find(m => m.id === 1);
    currentMap = maps.indexOf(target);
    player.y = 0;
  }

  // ✅ Giữ nhân vật trong giới hạn map SAU khi đổi map
  player.y = Math.max(0, Math.min(mapSize - 1, player.y));

  draw();
}
function isBlocked(x, y) {
  const map = maps[currentMap];
  return tileBlocked(map, x, y);
}

function movePlayer(dx, dy) {
  if (gameOver) return;

  let nx = player.x + dx;
  let ny = player.y + dy;

  // ---- kiểm tra chuyển map theo chiều ngang ----
  if (nx >= mapSize || nx < 0) {
    player.x = nx;
    updateMap();
    draw();
    return;
  }

  // ✅ ---- kiểm tra chuyển map theo chiều dọc ----
  if (ny >= mapSize || ny < 0) {
    player.y = ny;
    updateMap();
    draw();
    return;
  }

  // ---- di chuyển bình thường ----
  if (!isBlocked(nx, ny)) {
    player.x = nx;
    player.y = ny;
    draw();
  }
}

document.getElementById("up").onclick = () => movePlayer(0, -1);
document.getElementById("down").onclick = () => movePlayer(0, 1);
document.getElementById("left").onclick = () => movePlayer(-1, 0);
document.getElementById("right").onclick = () => movePlayer(1, 0);
document.getElementById("heal").onclick = usePotion;

// =================== ATTACK ===================
const attackButton = document.getElementById("attack");
attackButton.onclick = () => {
  if (gameOver || !canAttack) return;
  const map = maps[currentMap];
  let hitSomething = false;
  map.enemies.forEach(e => {
    if (!e.visible || e.hp <= 0) return;
    const dx = Math.abs(Math.floor(player.x) - e.x);
    const dy = Math.abs(Math.floor(player.y) - e.y);
    if (dx <= 2 && dy <= 1) {
      // base damage theo vũ khí
      let baseDamage = 1;
      if (player.weapon === "wood") baseDamage = 2;
      else if (player.weapon === "iron") baseDamage = 4;
      else if (player.weapon === "legendarySword") {
  baseDamage = 5;}

      const totalDamage = baseDamage + (player.damageBonus || 0);
      e.hp -= totalDamage;
      hitSomething = true;
      if (e.hp <= 0) handleEnemyDeath(e, map);
    }
  });
  if (hitSomething) {
    canAttack = false;
    attackButton.classList.add("cooldown");
    setTimeout(() => { canAttack = true; attackButton.classList.remove("cooldown"); }, 1000);
    draw();
  }
// Đào quặng nếu ở map 5
if (currentMap === 5) {
  map.ores.forEach((ore) => {
    const dx = Math.abs(player.x - ore.x);
    const dy = Math.abs(player.y - ore.y);
    if (dx <= 1 && dy <= 1 && ore.visible) {
      ore.visible = false; // ẩn quặng sau khi đào
      player.inventory.iron++;
      toast("⛏️ Bạn đã đào được 1 quặng sắt!", 1000);
      updateHotbar();
      hitSomething = true;
    }
  });
}
};

// =================== NPC & CRAFT ===================
const talkButton = document.getElementById("talk");
talkButton.onclick = () => {
  const map = maps[currentMap];
  (map.npcs || []).forEach(n => {
    const dx = Math.abs(Math.floor(player.x) - n.x);
    const dy = Math.abs(Math.floor(player.y) - n.y);
    if (dx <= 1 && dy <= 1) interactWithNPC(n);
  });
};

const craftingDiv = document.createElement("div");
craftingDiv.style = `
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.9);padding:16px;border:2px solid white;
  border-radius:10px;color:white;display:none;z-index:1000;text-align:center;
`;
document.body.appendChild(craftingDiv);

function showCraftingMenu() {
  craftingDiv.innerHTML = `
    <h3>Chế tạo vũ khí</h3>
    <p>Bạn có: ${player.inventory.wood} gỗ, ${player.inventory.iron} sắt</p>
    <button id="craftWoodSword"> Kiếm Gỗ (2 gỗ)</button><br><br>
    <button id="craftIronSword"> Kiếm Sắt (2 sắt + 1 gỗ)</button><br><br>
    <button id="closeCraft">❌ Thoát</button>
  `;
  craftingDiv.style.display = "block";
  document.getElementById("craftWoodSword").onclick = () => craftWeapon(1);
  document.getElementById("craftIronSword").onclick = () => craftWeapon(2);
  document.getElementById("closeCraft").onclick = closeCraftingMenu;
}

function closeCraftingMenu() { craftingDiv.style.display = "none"; }

function interactWithNPC(npc) {
  if (npc.message && npc.message.toLowerCase().includes("thợ")) showCraftingMenu();
  else if (npc.message) alert(npc.message);
}

function craftWeapon(choice) {
  if (choice === 1) {
    if (player.inventory.wood >= 2) {
      player.inventory.wood -= 2;
      player.weapon = "wood";
      toast("🪵 Bạn đã chế tạo Kiếm Gỗ!", 1200);
      closeCraftingMenu();
      updateHotbar();
      draw();
    } else alert("Thiếu gỗ để chế tạo!");
  } else if (choice === 2) {
    if (player.inventory.iron >= 2 && player.inventory.wood >= 1) {
      player.inventory.iron -= 2;
      player.inventory.wood -= 1;
      player.weapon = "iron";
      toast("⚔️ Bạn đã chế tạo Kiếm Sắt!", 1200);
      closeCraftingMenu();
      updateHotbar();
      draw();
    } else alert("Thiếu nguyên liệu để chế tạo!");
  }
}

// =================== ENEMY DEATH / RESPAWN ===================
function handleEnemyDeath(e, map) {
  if (!e.hasDropped) {
    e.hasDropped = true;
const drop = Math.random();
if (drop < 0.2) {
  // 20% rơi thuốc (từ 0.7 đến 0.9)
  player.inventory.potion++;
  toast("💊 Nhặt được 1 Bình thuốc!", 1000);
}
else if (drop < 0.9) {
  // 70% rơi gỗ
  player.inventory.wood++;
  toast("🌲 Nhặt được 1 Gỗ!", 1000);
} else if (drop < 1.0) {
  // 10% không rơi gì
  toast("💩", 800);
}

  }
  if (e.isBoss) {
  e.visible = false;
  toast("🔥 Bạn đã hạ BOSS!", 1500);

  // --- 20% cơ hội rơi Kiếm Huyền Thoại ---
  const dropChance = Math.random();
  if (dropChance < 0.2) {
    player.weapon = "legendarySword";
    toast("⚔️ Bạn nhận được KIẾM HUYỀN THOẠI!", 2000);
  }

  // --- Boss hồi sinh sau 30 giây ---
  setTimeout(() => {
    e.hp = e.maxHp;
    e.visible = true;
    e.hasDropped = false;
    e.respawnScheduled = false;
    const pos = randomEmptyTile(map);
    e.x = pos.x;
    e.y = pos.y;
    toast("💀 BOSS đã hồi sinh!", 1000);
  }, 30000);
}
   else {
    e.visible = false;
    e.respawnScheduled = true;
    setTimeout(() => {
      e.hp = e.maxHp;
      e.visible = true;
      e.respawnScheduled = false;
      e.hasDropped = false;
      const pos = randomEmptyTile(map);
      e.x = pos.x; e.y = pos.y;
      toast("👾 Quái đã hồi sinh!", 1000);
    }, 15000);
  }
}


// =================== PICKUP ITEMS (bấm vào một ô hoặc đứng lên để nhặt) ===================
canvas.addEventListener("click", (ev) => {
  // convert click to tile coords
  const rect = canvas.getBoundingClientRect();
  const cx = ev.clientX - rect.left;
  const cy = ev.clientY - rect.top;
  const tx = Math.floor(cx / tileSize);
  const ty = Math.floor(cy / tileSize);
  // pick up any item at (tx,ty)
  for (let i = itemsOnMap.length - 1; i >= 0; i--) {
    const it = itemsOnMap[i];
    if (it.x === tx && it.y === ty) {
      if (it.type === "potion") {
        player.inventory.potion++;
        toast("💊 + 1 bình thuốc!", 900);
      }
      itemsOnMap.splice(i,1);
      updateHotbar();
      draw();
    }
  }
});

// =================== USE POTION (buff +5 damage trong 10s) ===================
function usePotion() {
  if (player.inventory.potion > 0) {
    player.inventory.potion--;

    if (!player.buffActive) {
      player.buffActive = true;
      player.damageBonus += 5; // +5 damage
      toast("💥 Sức mạnh tăng +5 trong 10 giây!", 1200);

      setTimeout(() => {
        player.damageBonus -= 5; // trừ lại
        player.buffActive = false;
        toast("⚡ Hiệu lực thuốc đã hết!", 1000);
        updateHotbar();
        draw();
      }, 10000);
    } else {
      toast("Thuốc chưa hết tác dụng!", 1000);
    }

    updateHotbar();
    draw();
  } else {
    toast("Bạn không có thuốc để dùng!");
  }
}

// =================== ENEMY AI / MOVEMENT / ATTACK ===================
function enemyAI() {
  const map = maps[currentMap];
  const now = Date.now();
  if (now - lastEnemyMove < 600) return;
  lastEnemyMove = now;

  for (let i = 0; i < map.enemies.length; i++) {
    const e = map.enemies[i];
    if (!e.visible || e.hp <= 0) continue;

    const dx = Math.floor(player.x) - e.x;
    const dy = Math.floor(player.y) - e.y;
    const distance = Math.abs(dx) + Math.abs(dy);

    let moveX = 0, moveY = 0;
    if (distance <= 4) {
      moveX = Math.sign(dx);
      moveY = Math.sign(dy);
    } else {
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      const dir = dirs[Math.floor(Math.random() * dirs.length)];
      moveX = dir[0]; moveY = dir[1];
    }

    const newX = e.x + moveX;
    const newY = e.y + moveY;
    if (!tileBlocked(map, newX, newY)) {
      if (!(newX === Math.floor(player.x) && newY === Math.floor(player.y))) {
        e.x = Math.max(0, Math.min(mapSize-1, newX));
        e.y = Math.max(0, Math.min(mapSize-1, newY));
      }
    }

    // trong enemyAI()
  if (Math.abs(dx) <= 1 && Math.abs(dy) <= 1 && player.hp > 0) {
  let dmg = 1;
  if (e.isBoss) dmg = 4; // boss đánh 10 máu
  else if (currentMap === 3) dmg = 2; // map 2 quái đánh 2
  else if (currentMap === 2) dmg = 1; // map 3 quái đánh 3
  player.hp -= dmg;
  if (player.hp < 0) player.hp = 0;
}
  }

  draw();
}

// =================== GAMEOVER ===================
function checkGameOver() {
  if (player.hp <= 0 && !hasReset) {
    hasReset = true;
    gameOver = true;
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "white";
    ctx.font = "24px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("💀 Bạn đã bị đánh bại!", canvas.width/2, canvas.height/2);
    bgm.pause();
    setTimeout(() => location.reload(), 2000);
  }
}

// =================== GAMELOOP ===================
function gameLoop() {
  enemyAI();
  checkGameOver();
  requestAnimationFrame(gameLoop);
}
gameLoop()

// Hotbar setup
const hotbar = document.getElementById("hotbar");

const itemIcons = {
  wood: "gỗ",
  iron: "sắt",
  sword: "⚔️",
  potion: "🧪"
};

function updateHotbar() {
  hotbar.innerHTML = "";
  const items = player.inventory;
  const keys = ["wood", "iron", "sword", "potion"]; // chỉ 4 ô

  keys.forEach(key => {
    const div = document.createElement("div");
    div.style.cssText = `
      width: 55px;
      height: 55px;
      background: #222;
      border: 2px solid white;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 22px;
      cursor: pointer;
    `;
    const count = items[key] || 0;
    div.innerHTML = `
      ${itemIcons[key] || "❓"}
      <span style="font-size:14px">${count}</span>
    `;

    if (key === "potion" && count > 0) {
      div.onclick = () => usePotion();
    }

    hotbar.appendChild(div);
  });
}

setInterval(updateHotbar, 500);
updateHotbar();
</script>
